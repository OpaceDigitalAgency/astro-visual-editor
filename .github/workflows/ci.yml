name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Fail fast on a contaminated or unsynchronised release candidate
        run: node scripts/check-release-candidate.mjs
      - run: npm ci
      - run: npm run test:ci
      - if: matrix.node-version == '24'
        run: npx playwright install --with-deps chromium
      - if: matrix.node-version == '24'
        run: npm run test:e2e
