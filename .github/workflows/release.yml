name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11
      - name: Confirm tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node --print "require('./packages/astro-visual-editor/package.json').version")"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - name: Publish public beta with provenance
        run: npm publish --workspace @opacedev/astro-visual-editor --tag beta
